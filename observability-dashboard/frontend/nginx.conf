server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API is proxied rather than called cross-origin. One origin means no
  # CORS preflights, no credentials-mode juggling, and the browser sees the
  # same URLs in development (Vite proxies identically) and in production.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend trusts these to report the real client address in its logs.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Let a caller's own correlation id survive the hop.
    proxy_set_header X-Request-Id $http_x_request_id;
  }

  location /health {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Asset filenames contain a content hash, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: every unmatched path is a client route, not a 404. The
  # entry document must never be cached, or a deploy would leave browsers
  # loading an index.html that points at assets which no longer exist.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
