apiVersion: 1

providers:
  - name: observability-dashboard
    orgId: 1
    folder: 'Observability Dashboard'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
