global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: observability-dashboard

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The backend exposes /metrics on its container port, which stays 4000 on the
  # compose network regardless of what it is published as on the host.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:4000']
        labels:
          service: observability-backend
