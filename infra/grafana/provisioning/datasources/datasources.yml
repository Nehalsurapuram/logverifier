apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Lets a log line jump straight to the matching trace/metric view once
      # the backend emits correlation ids (phase 4).
      derivedFields:
        - name: requestId
          matcherRegex: '"requestId":"([^"]+)"'
          datasourceUid: loki
          url: '$${__value.raw}'
